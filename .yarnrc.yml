compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

npmMinimalAgeGate: '7d'

npmPreapprovedPackages:
  - '@midnight-ntwrk/compact-runtime@0.21.0'

# Upstream `@midnight-ntwrk` dependencies (compact-runtime, platform-js, midnight-js-*)
# still resolve from GitHub Packages, which rejects anonymous reads — see #56. No
# `npmPublishRegistry`: nothing is published under this scope any more.
npmScopes:
  midnight-ntwrk:
    npmAlwaysAuth: true
    npmRegistryServer: 'https://npm.pkg.github.com/'
  midnightntwrk:
    npmRegistryServer: 'https://registry.npmjs.org/'

yarnPath: .yarn/releases/yarn-4.10.3.cjs

changesetBaseRefs: ['origin/main']
