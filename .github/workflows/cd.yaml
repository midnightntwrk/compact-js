name: CD

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Is a release outstanding? Answered from the registry rather than from the push
  # event: while changesets are pending, main still carries the published version, and
  # merging the Version Packages PR bumps it to one npm has never seen. That stays true
  # until the publish succeeds, so a failed release can be finished by pushing again.
  assess:
    name: Assess
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needsPublish: ${{ steps.registry.outputs.needs-publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Look up the current version on npm
        id: registry
        run: |
          set -euo pipefail
          version=$(jq -er '.version' compact-js/package.json)
          needed=false

          # Any one of the three missing means the release is incomplete. Queried over
          # plain HTTP so no npm credentials are involved in the decision.
          for workspace in compact-js compact-js-node compact-js-command; do
            name=$(jq -er '.name' "$workspace/package.json")
            http=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/${name/\//%2f}/${version}")
            case "$http" in
              200) ;;
              404) needed=true ;;
              *) echo "::error::npm registry answered ${http} for ${name}@${version}"; exit 1 ;;
            esac
          done

          echo "::notice::${version} needs publishing: ${needed}"
          echo "needs-publish=${needed}" >> "$GITHUB_OUTPUT"

  # Opens and updates the "Version Packages" PR. Ungated: the release PR is
  # refreshed on every push to main, and the human gate is merging it.
  version:
    name: Version (release PR)
    runs-on: ubuntu-latest
    # Superseding an in-flight update is correct — the newer push produces the same PR
    # from newer changesets.
    concurrency:
      group: cd-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # This job never runs npm, so it needs no registry-url, scope or NODE_AUTH_TOKEN.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Configure Yarn
        uses: ./.github/actions/configure-yarn
        with:
          github-packages-token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create / update Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # ratchet:changesets/action@v1.9.0
        with:
          version: yarn release:prepare
          title: 'chore: release'
          commit: 'chore: version packages'
          # No `publish` here — publishing is the gated job below.
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

  ci:
    name: Build, Lint and Test
    needs: assess
    if: needs.assess.outputs.needsPublish == 'true'
    uses: ./.github/workflows/ci-base.yaml
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    with:
      # Not used to publish — `changeset publish` packs each package's `dist/`. The zip
      # is kept because the QA test evidence is built from it (see qa/tests/evidence/).
      create-package-artifacts: true
    secrets:
      MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

  # Publishes straight to npmjs with Trusted Publishing, tags, and creates the GitHub
  # Releases. `changeset publish` skips any version already on the registry, so re-running
  # after a partial failure finishes the release rather than repeating it.
  publish:
    name: Publish
    needs: [assess, ci]
    if: needs.assess.outputs.needsPublish == 'true'
    runs-on: ubuntu-latest
    # Keyed on the commit, so a later push can never cancel a release that is queued
    # behind the reviewer gate — GitHub keeps only one pending run per group.
    concurrency:
      group: cd-publish-${{ github.sha }}
      cancel-in-progress: false
    # Human gate on anything reaching npmjs. The name must match the Trusted Publisher
    # configured on each package, or the OIDC exchange fails with a 403.
    environment: npm-publish-stable
    permissions:
      contents: write # push release tags and create Releases
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # No NODE_AUTH_TOKEN and no always-auth here: a token in the environment shadows
      # OIDC, and always-auth writes an empty `_authToken` line into ~/.npmrc, which is
      # the usual reason Trusted Publishing is silently never attempted.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          registry-url: https://registry.npmjs.org
          scope: '@midnightntwrk'
          node-version-file: .nvmrc

      # Trusted Publishing needs npm >= 11.5.1; the version bundled with .nvmrc's Node is
      # older, and an older npm does not attempt OIDC at all.
      - name: Use an npm that supports Trusted Publishing
        run: npm install -g npm@latest

      # Installing still reads upstream @midnight-ntwrk packages from GitHub Packages.
      - name: Configure Yarn
        uses: ./.github/actions/configure-yarn
        with:
          github-packages-token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build and package
        run: yarn build && yarn package

      # Creates one tag and one GitHub Release per package, with the body taken from
      # that package's CHANGELOG.md — which `changeset version` wrote from the changesets.
      # rc versions are flagged as prereleases, so they do not become "Latest".
      - name: Publish and release
        id: publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # ratchet:changesets/action@v1.9.0
        with:
          publish: yarn changeset publish
          createGithubReleases: true
          setupGitUser: true
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          NPM_CONFIG_PROVENANCE: 'true'

      # The three packages are a `fixed` Changesets group, so they always share a version
      # and the release has a single identity. This aggregate tag is that identity — the
      # form the QA test evidence and the component release note cite.
      - name: Tag and release the version as a whole
        env:
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' compact-js/package.json)
          tag="compact-js-v${version}"

          # Gated on the registry rather than on the publish step's output: that output is
          # false whenever every version is already on npm, so a re-run after a failure
          # below would skip this step and leave the release permanently untagged. Queried
          # over plain HTTP because the ~/.npmrc setup-node writes carries an empty
          # `_authToken`, which can turn a 404 into a 401.
          set +e
          http=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/@midnightntwrk%2fcompact-js/${version}")
          reachable=$?
          set -e
          [[ $reachable -eq 0 ]] || { echo "::error::could not reach the npm registry"; exit 1; }
          case "$http" in
            200) ;;
            404)
              echo "::notice::@midnightntwrk/compact-js@${version} is not on npm — nothing to tag"
              exit 0
              ;;
            *) echo "::error::npm registry answered ${http} for ${version}"; exit 1 ;;
          esac

          # --exit-code reports 2 for "no such ref"; 128 is an auth or network failure and
          # must not be read as the tag being absent.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1
          found=$?
          set -e
          if [[ $found -eq 0 ]]; then
            echo "::notice::${tag} already exists — leaving it in place"
          elif [[ $found -eq 2 ]]; then
            git tag -a "$tag" -m "compact-js ${version}"
            git push origin "$tag"
          else
            echo "::error::could not query tag ${tag} (git ls-remote exit ${found})"
            exit 1
          fi

          # The sections `changeset version` wrote for this version, across all three
          # CHANGELOGs — the same content the per-package Releases carry.
          node scripts/release-body.mjs "$version" release-body.md

          # An rc must never become the repository's "Latest" release.
          flags=()
          [[ "$version" == *-* ]] && flags=(--prerelease --latest=false)

          # Branch only on a genuine not-found: an auth error or a 5xx must fail the job
          # rather than being retried as a create that then fails for the wrong reason.
          set +e
          error=$(gh release view "$tag" --repo "$REPO" 2>&1 >/dev/null)
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            gh release edit "$tag" --notes-file release-body.md --repo "$REPO" "${flags[@]}"
          elif grep -qi "release not found" <<<"$error"; then
            gh release create "$tag" --title "compact-js v${version}" \
              --notes-file release-body.md --repo "$REPO" "${flags[@]}"
          else
            echo "::error::could not query release ${tag}: ${error}"
            exit 1
          fi
