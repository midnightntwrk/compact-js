name: CD
env:
  MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint and Test
    uses: ./.github/workflows/ci-base.yaml
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    with:
      create-package-artifacts: true
    secrets:
      MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

  publish:
    needs: ci
    name: Publish Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: '@midnight-ntwrk'
          node-version-file: .nvmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      # `changeset version` set this in the release PR; CD never computes or bumps a version.
      - name: Resolve version
        id: vars
        run: |
          version=$(jq -r '.version' ./compact-js/package.json)
          if [[ "$version" == *-* ]]; then
            dist_tag="${version#*-}"
            dist_tag="${dist_tag%%.*}"
          else
            dist_tag=latest
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"

      - name: Publish Package Artifacts
        uses: ./.github/actions/publish-package-artifacts
        with:
          package-archive-name: 'compact-js'
          working-directory: .
          auth-token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          dist-tag: ${{ steps.vars.outputs.dist_tag }}

  release:
    needs: publish
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The note is a reviewed artifact of the release PR, so CD reads it and never
      # writes it. An absent note means the PR skipped `yarn release:prepare`.
      - name: Locate the release note
        id: note
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          note="docs/release-notes/${VERSION}.md"
          if [[ ! -f "$note" ]]; then
            echo "::error::$note is missing — run 'yarn release:prepare' and merge it before releasing ${VERSION}"
            exit 1
          fi
          todos=$(grep -c 'TODO (owner):' "$note" || true)
          if [[ "$todos" -gt 0 ]]; then
            echo "::warning::$note still carries ${todos} 'TODO (owner):' marker(s)"
          fi
          {
            echo "### Release notes — compact-js ${VERSION}"
            echo
            echo "\`${todos}\` owner TODO(s) left in \`${note}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "path=${note}" >> "$GITHUB_OUTPUT"
          echo "tag=compact-js-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # ratchet:actions/upload-artifact@v5.0.0
        with:
          name: Release notes ${{ needs.publish.outputs.version }}
          path: ${{ steps.note.outputs.path }}

      # `gh release create` creates the tag server-side from --target, so there is no
      # tag push and nothing to collide on a re-dispatch.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.note.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
          NOTE: ${{ steps.note.outputs.path }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists — updating its notes"
            gh release edit "$TAG" \
              --title "compact-js v${VERSION}" \
              --notes-file "$NOTE" \
              --repo "$REPO"
          else
            gh release create "$TAG" \
              --title "compact-js v${VERSION}" \
              --notes-file "$NOTE" \
              --target "$SHA" \
              --repo "$REPO"
          fi
