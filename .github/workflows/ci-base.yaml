name: CI - (base)
env:
  MIDNIGHTCI_PACKAGES_WRITE: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

permissions: {}

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MIDNIGHTCI_PACKAGES_WRITE:
        description: Pulls the compactc image from ghcr.io and fetches compactc releases.
        required: true
    inputs:
      node-version-file:
        type: string
        required: false
        default: '.nvmrc' # Default to the Node.js version defined in the repo root.
      coverage-files:
        type: string
        required: false
        default: ''
      create-package-artifacts:
        type: boolean
        description: A flag indicating whether the compiled packages should be created and attached to the build.
        required: false
        default: false
      snapshot-tag:
        type: string
        description: Version the workspace as a throwaway snapshot under this name before building, instead of at the version the manifests carry.
        required: false
        default: ''

jobs:
  ci:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load environment variables
        run: |
          export $(grep -v '^#' .github/env/global.env | xargs)
          for var in $(cut -d= -f1 .github/env/global.env); do
            echo "$var=${!var}" >> $GITHUB_ENV
          done

      - name: Log in to GitHub Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # ratchet:docker/login-action@v4.8.0
        with:
          registry: 'https://ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Configure Yarn
        uses: ./.github/actions/configure-yarn

      - name: Cache Turbo and Yarn dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # node_modules is deliberately not cached. Its layout depends on where the
          # workspace root sits, so a restore-keys fallback can resurrect a tree from a
          # previous repo layout and shadow the real one. Caching Yarn's own cache gives
          # the same speed-up while leaving `yarn install` authoritative.
          path: |
            .yarn/cache
            .turbo
          key: turbo-v2-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
            turbo-v2-${{ runner.os }}-

      - name: Install dependencies
        run: |
          yarn install

      # A canary ships the branch as it stands, so the manifests have to carry its
      # version before the build copies them into each `dist/`. `{commit}` rather than
      # the default `{datetime}`: the publish job re-runs this on the same commit and
      # has to arrive at the same version. Snapshot mode commits nothing.
      - name: Version as a snapshot
        if: ${{ inputs.snapshot-tag != '' }}
        env:
          SNAPSHOT_TAG: ${{ inputs.snapshot-tag }}
        run: |
          set -euo pipefail
          yarn changeset version --snapshot "$SNAPSHOT_TAG" --snapshot-prerelease-template '{tag}-{commit}'

          # With nothing to version the command succeeds and changes nothing, which would
          # otherwise build the released version under a canary name and publish nothing.
          version=$(jq -er '.version' compact-js/package.json)
          if [[ "$version" != 0.0.0-"$SNAPSHOT_TAG"-* ]]; then
            echo "::error::versioning left ${version} rather than a ${SNAPSHOT_TAG} snapshot — this branch has no pending changeset to build one from"
            exit 1
          fi
          echo "::notice::building ${version}"

      - name: Run build
        run: yarn build --cache-dir ./turbo
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Run linter
        run: yarn lint

      - name: Run tests
        run: |
          yarn test --concurrency 1 --cache-dir ./turbo
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      # `scripts/` is not a workspace, so turbo does not reach it.
      - name: Run release-script tests
        run: yarn test-scripts

      # Lints the generated dist manifests, which are what gets published and what no
      # in-repo import resolves through.
      - name: Check packaging
        run: yarn package && yarn check-packaging

      - name: Aggregate coverage reports
        run: |
          mkdir -p .nyc_output
          find . -type f -name 'coverage-final.json' -exec cp {} .nyc_output/ \;
          npx --yes nyc merge .nyc_output coverage.json
          npx --yes nyc report --reporter=html --report-dir=coverage --temp-dir=.nyc_output
          rm -rf .nyc_output

      - name: Merge report as ZIP
        run: |
          #ArtiomTr/jest-coverage-report-action@v2 has a bug, this is temp solution
          mv coverage coverage_$(date +"%Y%m%d%H%M%S")
          zip -r coverage-compact-js.zip coverage*

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: Coverage Report compact-js
          path: coverage-compact-js.zip

      - name: Publish Test Coverage
        if: ${{ inputs.coverage-files }} # Publish the comment if we have received coverage files
        uses: MishaKav/jest-coverage-comment@7032bf8e71aa2b267b6b143be3c4480b625c2b12 # ratchet:MishaKav/jest-coverage-comment@v1
        with:
          hide-comment: false
          unique-id-for-comment: compact-js-coverage
          multiple-files: ${{ inputs.coverage-files }}

      - name: Pack and Upload Package Artifacts
        if: ${{ inputs.create-package-artifacts }}
        uses: ./.github/actions/create-package-artifacts
        with:
          package-archive-name: compact-js
          working-directory: .
