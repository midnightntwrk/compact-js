name: 'Publish Package Artifacts'
description: 'Publishes packages to npmjs using Trusted Publishing (OIDC)'

inputs:
  working-directory:
    type: string
    required: true
  package-archive-name:
    type: string
    required: true

outputs:
  published:
    description: 'Newline-separated <name>@<version> for each package published by this run'
    value: ${{ steps.publish.outputs.published }}

runs:
  using: 'composite'
  steps:
    - name: Download packages artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
      with:
        pattern: Packages ${{ inputs.package-archive-name }}
        path: ${{ inputs.working-directory }}

    - name: Extract packages archive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: find "./Packages ${{ inputs.package-archive-name }}" -type f -name '*.zip' -execdir unzip '{}' ';'

    # No token is passed: npmjs Trusted Publishing exchanges the job's OIDC
    # token for a short-lived credential, and NODE_AUTH_TOKEN would shadow it.
    # Versions already on the registry are skipped, so this is re-runnable.
    - name: Publish packages
      id: publish
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        log=$(mktemp)
        node scripts/release.mjs --from "./Packages ${{ inputs.package-archive-name }}" | tee "$log"
        {
          echo 'published<<PUBLISHED_EOF'
          sed -n 's/^New tag: //p' "$log"
          echo 'PUBLISHED_EOF'
        } >> "$GITHUB_OUTPUT"
