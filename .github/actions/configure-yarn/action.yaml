name: 'Configure Yarn'
description: 'Provisions the pinned Yarn'

runs:
  using: 'composite'
  steps:
    # Provisions the Yarn version pinned by each workspace's `packageManager` field.
    # Without this the runner's Yarn 1.x shim is used instead.
    - name: Enable corepack
      shell: bash
      run: corepack enable

    # No registry credential is configured here on purpose: every dependency now resolves
    # anonymously from npmjs, so a clean clone installs with no token (#56).
