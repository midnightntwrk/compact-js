name: "Create Package Artifacts"
description: "Packs the built workspace packages into tarballs for publishing"

inputs:
  package-archive-name:
    type: string
    required: true
  working-directory:
    type: string
    required: true

runs:
  using: "composite"
  steps:
    # Versions and CHANGELOGs are already correct here: `changeset version` wrote
    # them in the Version Packages PR that this commit merged.
    - name: Create packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn package

    - name: Create packages archive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: find . -type f -name '*.tgz' | zip ${{ inputs.package-archive-name }}-packages.zip -j -@

    - name: Upload packages artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # ratchet:actions/upload-artifact@v4
      with:
        name: Packages ${{ inputs.package-archive-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.package-archive-name }}-packages.zip
