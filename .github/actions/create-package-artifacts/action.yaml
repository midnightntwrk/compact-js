name: "Create Package Artifacts"
description: "Packs the workspace packages at the version their manifests already carry"

inputs:
  package-archive-name:
    type: string
    required: true
  working-directory:
    type: string
    required: true

runs:
  using: "composite"
  steps:
    # `changeset version` set this in the release PR, so the manifests are
    # authoritative here and nothing is bumped on the runner.
    - name: Resolve version
      id: vars
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        target_version=$(jq -er '.version' compact-js/package.json)
        echo "target_version=${target_version}" >> "$GITHUB_OUTPUT"

    # The three packages are a `fixed` Changesets group, so a split version means
    # the release PR was hand-edited or only partly applied.
    - name: Verify manifests agree on the version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET_VERSION: ${{ steps.vars.outputs.target_version }}
      run: |
        for pkg in compact-js compact-js-node compact-js-command; do
          found=$(jq -er '.version' "$pkg/package.json")
          if [[ "$found" != "$TARGET_VERSION" ]]; then
            echo "::error::$pkg is at $found but compact-js is at $TARGET_VERSION — the three packages are a 'fixed' group and must share a version"
            exit 1
          fi
        done

    - name: Create packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn package

    - name: Create packages archive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARCHIVE_NAME: ${{ inputs.package-archive-name }}
        TARGET_VERSION: ${{ steps.vars.outputs.target_version }}
      run: find . -type f -name '*.tgz' | zip "$ARCHIVE_NAME-$TARGET_VERSION.zip" -j -@

    - name: Upload packages artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # ratchet:actions/upload-artifact@v5.0.0
      with:
        name: Packages ${{ inputs.package-archive-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.package-archive-name }}-${{ steps.vars.outputs.target_version }}.zip

    # `changeset publish` ships these directories verbatim (publishConfig.directory), so
    # the release job downloads them rather than rebuilding what CI already tested.
    - name: Upload dist artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # ratchet:actions/upload-artifact@v5.0.0
      with:
        name: Dist ${{ inputs.package-archive-name }}
        path: |
          ${{ inputs.working-directory }}/compact-js/dist
          ${{ inputs.working-directory }}/compact-js-node/dist
          ${{ inputs.working-directory }}/compact-js-command/dist
