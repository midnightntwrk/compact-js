# Wait 7 days before resolving newly published package versions, to reduce exposure to
# malicious or unstable releases (supply-chain age gate; requires Yarn >= 4.10).
npmMinimalAgeGate: '7d'

# Both scopes resolve from the default registry. Do not route `@midnight-ntwrk` back to
# GitHub Packages: it rejects anonymous reads even for public packages, which is what made
# a clean clone need a token (#56). Every version used here is also published to npmjs.
npmScopes:
  midnight-ntwrk:
    npmRegistryServer: 'https://registry.npmjs.org/'
  midnightntwrk:
    npmRegistryServer: 'https://registry.npmjs.org/'
